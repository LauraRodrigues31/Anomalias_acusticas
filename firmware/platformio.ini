; Ambientes: esp32dev (produção), esp32-test (áudio pela serial), esp32-selftest (bring-up),
; native (testes Unity no PC), native-cli (executável dsp_cli no PC).
[platformio]
default_envs = esp32dev

[env]
build_flags = -Iinclude -Wall -Wextra

[env:esp32dev]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 115200
build_flags = ${env.build_flags}

[env:esp32-test]
extends = env:esp32dev
build_flags = ${env.build_flags} -DAUDIO_SOURCE_SERIAL=1

[env:esp32-selftest]
extends = env:esp32dev
build_flags = ${env.build_flags} -DBOARD_SELFTEST=1

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17
lib_deps =
build_src_filter = -<*>

[env:native-cli]
platform = native
build_flags = ${env.build_flags} -std=gnu++17 -O2
build_src_filter = -<*> +<../tools/dsp_cli.cpp>
